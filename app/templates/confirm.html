<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking Confirmation</title>
</head>
<body>
    <h1>Booking Confirmation</h1>
    {% if ticket %}
        <p>You have successfully booked: <strong>{{ ticket.event }}</strong></p>
    {% else %}
        <p>Ticket not found.</p>
    {% endif %}
    <a href="{{ url_for('main.index') }}">Back to Tickets</a>
</body>
</html>
